"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000
format = "[$directory$git_branch]($style)$character"

right_format = """
$git_status\
$python\
$all\
${custom.docker}\
$cmd_duration\
$line_break\
"""

[fill]
symbol = ' '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[](bold red) '

[directory]
read_only = " 󰌾"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "


[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[\[$all_status\]]($style) '
ahead      = "⇡${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
behind     = "⇣${count}"
conflicted = ""
up_to_date = ""
untracked  = "?"
modified   = ""
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

# [git_branch]
# symbol = " "
# format = '[$symbol$branch]($style) '

# [git_commit]
# tag_symbol = '  '

[python]
symbol = " "
version_format = '${major}.${minor}'
format = '[${symbol}${version} (${virtualenv})]($style) '

[cmd_duration]
# format = "[$duration]($style) "
format = '\[[$duration]($style)\] '
style = "yellow"

[custom.docker]
detect_files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
symbol = "  "
# Custom modules require a command to succeed in order to render, so we just echo a space
command = "echo ' '" 
format = "[$symbol]($style) "
style = "#1c86ee"

