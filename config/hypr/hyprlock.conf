# Robin's theme-aware Hyprlock configuration

source = $HOME/robin/current/theme/hyprlock.conf

general {
    hide_cursor = true
    immediate_render = true
}

# Background
background {
    monitor =
    path = /home/suyashk13/robin/current/theme/backgrounds/1-scenery-pink-lakeside-sunset-lake-landscape-scenic-panorama-7680x3215-144.png

    blur_passes = 2
    blur_size = 8
    vibrancy = 0.2
    color = $color
}

# Time
label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 96
    font_family = CaskaydiaMono Nerd Font

    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $accent_color
    font_size = 20
    font_family = CaskaydiaMono Nerd Font

    position = 0, 30
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    rounding = 0

    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color

    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false

    check_color = $check_color
    fail_color = $fail_color
    capslock_color = $capslock_color

    position = 0, -90
    halign = center
    valign = center
}
